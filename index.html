    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --color-brand-primary: #32104D;     /* Deep Plum */
            --color-brand-interactive: #6C35A6; /* Royal Violet */
            --color-brand-accent: #A78BCE;      /* Soft Lavender */
            --color-brand-surface: #F3EDF8;     /* Lavender Mist */
            --color-brand-background: #FDFBFF;  /* Pearl White */
        }
        /* Royal Violet text on dark surfaces lacks contrast; use Soft Lavender there */
        .dark .text-brand-interactive {
            color: var(--color-brand-accent);
        }
        :focus-visible {
            outline: 2px solid var(--color-brand-interactive);
            outline-offset: 2px;
        }
        .dark :focus-visible {
            outline-color: var(--color-brand-accent);
        }

        /* ── Core Smooth Scrolling & Typography Optimization ── */
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
            overflow: hidden;
        }
        .lenis.lenis-smooth iframe {
            pointer-events: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-overflow-scrolling: touch;
        }
        h1, h2, h3, h4, .font-elegant {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.02em;
        }

        /* ── Luxury Slim Floating Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(108, 53, 166, 0.28);
            border-radius: 9999px;
            transition: background 0.25s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(108, 53, 166, 0.7);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 206, 0.3);
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 206, 0.75);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(108, 53, 166, 0.3) transparent;
        }
        .dark * {
            scrollbar-color: rgba(167, 139, 206, 0.35) transparent;
        }
        /* .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        } */
        .dark .glass {
            background: rgba(13, 13, 13, 0.8);
        }
        .stagger-child > * {
            opacity: 0;
            transform: translateY(20px);
        }
   @keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.animate-marquee {
  animation: marquee 20s linear infinite;
}
    </style>
